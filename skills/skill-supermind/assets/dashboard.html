<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Skill Supermind Dashboard</title>
  <style>
    :root{--bg:#09111f;--panel:#111d31;--panel2:#172640;--line:#263b5c;--text:#e7eefb;--muted:#8fa6c6;--cyan:#63d9e8;--green:#73e0a2;--amber:#f6c76b;--red:#ff8297;--purple:#bda5ff;--shadow:0 12px 34px #0005}
    *{box-sizing:border-box} body{margin:0;background:radial-gradient(circle at 85% -10%,#1c4160 0,#09111f 42%);color:var(--text);font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}
    .shell{display:grid;grid-template-columns:245px 1fr;min-height:100vh}.sidebar{padding:24px 16px;border-right:1px solid var(--line);background:#09111fcc;backdrop-filter:blur(16px)}.brand{font-weight:800;letter-spacing:.04em;font-size:18px;margin:0 8px 6px}.brand span{color:var(--cyan)}.subtle{color:var(--muted);font-size:12px;margin:0 8px 28px}.nav{display:grid;gap:7px}.nav button{border:1px solid transparent;background:transparent;color:var(--muted);text-align:left;border-radius:9px;padding:11px 12px;cursor:pointer;font:inherit}.nav button:hover{background:#13243d;color:var(--text)}.nav button.active{background:#173451;color:var(--cyan);border-color:#2e6380}.nav small{float:right;color:#6684aa}.main{padding:30px 34px;max-width:1600px;width:100%}.top{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:24px}.eyebrow{color:var(--cyan);font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700}.title{font-size:29px;font-weight:750;margin:4px 0 4px}.desc{color:var(--muted);margin:0}.actions{display:flex;gap:9px}.button{background:#18324d;color:var(--cyan);border:1px solid #2d5875;border-radius:8px;padding:9px 12px;cursor:pointer;font:inherit}.button:hover{background:#214665}.grid{display:grid;gap:15px}.cards{grid-template-columns:repeat(auto-fit,minmax(185px,1fr))}.card,.section{background:linear-gradient(145deg,#14243bdd,#0e1a2ddd);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}.card{padding:17px}.label{color:var(--muted);font-size:12px}.value{font-size:27px;font-weight:750;margin-top:5px}.detail{color:var(--muted);font-size:12px;margin-top:3px}.section{padding:18px;margin-top:16px}.section h2{font-size:15px;margin:0 0 14px}.section h3{font-size:13px;margin:18px 0 8px;color:var(--muted)}.two{grid-template-columns:minmax(0,1.5fr) minmax(290px,1fr)}.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.section-head h2{margin:0}.pill{display:inline-flex;align-items:center;border:1px solid #345371;border-radius:999px;padding:3px 8px;color:var(--cyan);font-size:11px;white-space:nowrap}.pill.good{color:var(--green);border-color:#286c50}.pill.warn{color:var(--amber);border-color:#80632c}.pill.bad{color:var(--red);border-color:#803b51}.bar{height:8px;background:#20334e;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--green));border-radius:99px}.metric-row{display:grid;grid-template-columns:150px 1fr 60px;gap:10px;align-items:center;margin:10px 0}.metric-row .name{color:var(--muted);font-size:12px}.metric-row .num{text-align:right;font-variant-numeric:tabular-nums;color:var(--text)}svg{width:100%;min-height:390px;background:#0a1627;border:1px solid #203754;border-radius:9px}.legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.legend span{font-size:11px;color:var(--muted);border:1px solid var(--line);padding:4px 7px;border-radius:6px}.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}table{width:100%;border-collapse:collapse}th{text-align:left;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em;padding:8px 9px;border-bottom:1px solid var(--line)}td{padding:10px 9px;border-bottom:1px solid #1d3049;vertical-align:top}tr:hover td{background:#15294399}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px;color:#b8cae4}.role{display:inline-block;margin:2px 4px 2px 0;padding:3px 6px;border-radius:5px;background:#203b5b;color:#b7d8f1;font-size:11px}.role.lead{background:#14536a;color:#9ef4ff}.role.validator{background:#3d3268;color:#d9ccff}.role.fallback{background:#61492a;color:#ffdda0}.event{display:grid;grid-template-columns:45px 80px 1fr;gap:10px;padding:11px 0;border-bottom:1px solid #1d3049}.event:last-child{border-bottom:0}.seq{color:var(--cyan);font-weight:700}.kind{color:var(--purple);font-size:11px;text-transform:uppercase}.payload{color:#b4c5dc;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.empty{color:var(--muted);padding:18px 0}.cal-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:12px}.cal-card{background:#0d1a2c;border:1px solid #29415f;border-radius:9px;padding:13px}.cal-card h3{margin:0 0 9px;color:var(--text);font-size:14px}.kv{display:flex;justify-content:space-between;gap:10px;padding:3px 0;color:var(--muted);font-size:12px}.kv b{color:var(--text);font-weight:600}.footer-note{color:#6f86a5;font-size:12px;margin-top:20px}.error{border:1px solid #813d50;background:#351d2a;color:#ffb4c1;border-radius:8px;padding:12px;margin:12px 0}.queue-summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}.queue-stat{background:#0d1a2c;border:1px solid #29415f;border-radius:9px;padding:12px}.queue-stat strong{display:block;font-size:22px;margin-top:3px}.action-list{display:grid;gap:10px}.action-item{display:grid;grid-template-columns:105px 90px 1fr;gap:12px;align-items:start;background:#0d1a2c;border:1px solid #29415f;border-left:3px solid var(--cyan);border-radius:9px;padding:13px}.action-item.high{border-left-color:var(--red)}.action-item.medium{border-left-color:var(--amber)}.action-item.low{border-left-color:var(--green)}.action-signal{font-weight:700}.cache-reason-row,.health-list-row{align-items:flex-start}.chip-list{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:5px;max-width:72%;max-height:92px;overflow:auto}.chip{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:#20304a;border:1px solid #344c6b;border-radius:5px;padding:3px 6px;color:#b8cae4;font:10px/1.3 ui-monospace,SFMono-Regular,Consolas,monospace;font-weight:400}.health-root{overflow-wrap:anywhere;text-align:right}.action-detail{color:var(--muted);font-size:12px;margin-top:4px}.freshness-indicator{display:flex;align-items:flex-start;gap:12px;background:#0d1a2c;border:1px solid #29415f;border-radius:9px;padding:11px 12px;margin-bottom:12px}.freshness-indicator .detail{margin-top:2px}.action-evidence{color:#91a9c8;font:11px/1.4 ui-monospace,SFMono-Regular,Consolas,monospace;margin-top:7px;white-space:pre-wrap;word-break:break-word}.filter-bar{display:grid;grid-template-columns:repeat(4,minmax(140px,1fr));gap:10px;background:#0d1a2c;border:1px solid #29415f;border-radius:9px;padding:12px;margin-bottom:14px}.filter-field{display:grid;gap:5px}.filter-field label{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em}.filter-field select{width:100%;background:#13243d;color:var(--text);border:1px solid #345371;border-radius:7px;padding:8px;font:inherit;font-size:12px}.action-buttons{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}.action-button{background:#173451;color:var(--cyan);border:1px solid #2e6380;border-radius:7px;padding:6px 9px;cursor:pointer;font:inherit;font-size:11px}.action-button:hover{background:#214665}.action-button:disabled{opacity:.5;cursor:wait}.action-state{font-size:11px;color:var(--muted);margin-top:8px}.flash{animation:flash .35s ease}@media(max-width:850px){.filter-bar{grid-template-columns:repeat(2,minmax(140px,1fr))}}@keyframes flash{from{background:#24516a}to{background:transparent}}@media(max-width:850px){.shell{display:block}.sidebar{border-right:0;border-bottom:1px solid var(--line);padding:16px}.nav{grid-template-columns:repeat(3,1fr);display:grid}.subtle{margin-bottom:14px}.main{padding:22px 16px}.two{grid-template-columns:1fr}.top{display:block}.actions{margin-top:12px}.metric-row{grid-template-columns:115px 1fr 50px}.action-item{grid-template-columns:1fr 1fr}.action-item>div:last-child{grid-column:1/-1}}
  </style>
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="brand">skill<span>·</span>supermind</div>
    <p class="subtle">local control plane / read-only</p>
    <nav class="nav">
      <button data-view="overview" class="active">Overview <small>⌂</small></button>
      <button data-view="graph">Skill graph <small>⌘</small></button>
      <button data-view="routes">Routes <small>↗</small></button>
      <button data-view="journal">Journal <small>≡</small></button>
      <button data-view="calibration">Calibration <small>◌</small></button>
      <button data-view="benchmarks">Benchmarks <small>↯</small></button>
      <button data-view="skippedTrees">Skipped trees <small>⊘</small></button>
      <button data-view="weekly">Action queue <small>!</small></button>
    </nav>
  </aside>
  <main class="main">
    <header class="top"><div><div class="eyebrow">research operations</div><h1 id="page-title">Overview</h1><p id="page-desc" class="desc">A read-only view of catalog structure, evidence, and measured behavior.</p></div><div class="actions"><button class="button" id="refresh">Refresh data</button></div></header>
    <div id="content"><div class="empty">Loading local artifacts…</div></div>
    <div class="footer-note">All data is read from local SQLite/JSON artifacts. No network calls are made by this dashboard.</div>
  </main>
</div>
<script>
const validViews=['overview','graph','routes','journal','calibration','benchmarks','skippedTrees','weekly'];
function readUrlState(){const params=new URLSearchParams(window.location.search);const view=params.get('view');return {view:validViews.includes(view)?view:'overview',filters:{priority:params.get('priority')||'',status:params.get('status')||'',period:params.get('period')||'',skill:params.get('skill')||''}}}
const initialState=readUrlState();const state={view:initialState.view,filters:initialState.filters,data:null};
function syncUrl(){const url=new URL(window.location.href);const values={view:state.view==='overview'?'':state.view,...state.filters};for(const [key,value] of Object.entries(values)){if(value)url.searchParams.set(key,value);else url.searchParams.delete(key)}window.history.replaceState(null,'',url.pathname+url.search+url.hash)}
const titles={overview:['Overview','A read-only view of catalog structure, evidence, and measured behavior.'],graph:['Skill graph','Typed relationships, domains, tags, and bounded graph structure.'],routes:['Routes','Recent journal-backed route decisions and selected roles.'],journal:['Journal','Append-only event timeline with privacy-aware payloads.'],calibration:['Calibration','Wilson-selected policies, domain scopes, held-out metrics, and temporal drift.'],benchmarks:['Benchmarks','Synthetic scale runs, comparisons, resource policy, and history.'],skippedTrees:['Skipped benchmark trees','Excluded roots and shallow sizes without recursively traversing their contents.'],weekly:['Action queue','Prioritized human review signals from the latest weekly operations report.']};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>n===null||n===undefined?'—':typeof n==='number'?n.toLocaleString(undefined,{maximumFractionDigits:3}):esc(n);
const fmtBytes=n=>{if(n===null||n===undefined)return'—';if(n<1024)return`${fmt(n)} B`;const units=['KB','MB','GB','TB'];let value=n/1024,index=0;while(value>=1024&&index<units.length-1){value/=1024;index++}return`${value.toLocaleString(undefined,{maximumFractionDigits:1})} ${units[index]}`};
const pct=n=>n===null||n===undefined?'—':Math.round(n*100)+'%';
const cls=ok=>ok?'good':ok===false?'bad':'warn';
const pill=(text,ok)=>`<span class="pill ${cls(ok)}">${esc(text)}</span>`;
async function get(path){const r=await fetch(path,{cache:'no-store'});return r.json()}
async function load(){const [overview,health,graph,journal,calibration,benchmarks,skippedTrees,weekly]=await Promise.all([get('/api/overview'),get('/api/health'),get('/api/graph'),get('/api/journal'),get('/api/calibration'),get('/api/benchmarks'),get('/api/skipped-benchmark-trees'),get('/api/weekly')]);state.data={overview,health,graph,journal,calibration,benchmarks,skippedTrees,weekly};render()}
function card(label,value,detail=''){return `<div class="card"><div class="label">${esc(label)}</div><div class="value">${fmt(value)}</div><div class="detail">${esc(detail)}</div></div>`}
function renderCachePanel(cache={}){const reasons=cache.last_invalidation_reasons||[];const visible=reasons.slice(0,4);const extra=reasons.length-visible.length;const reasonNodes=[...visible.map(reason=>`<span class="chip" title="${esc(reason)}">${esc(reason)}</span>`),...(extra>0?[`<span class="chip">+${extra} more</span>`]:[])];const checks=cache.checks||0;return `<div class="kv"><span>Cache hit rate</span><b>${pct(cache.hit_rate)} <span class="detail">${fmt(cache.hits||0)} / ${fmt(checks)} checks</span></b></div><div class="kv"><span>Last rebuild</span><b class="mono">${fmt(cache.last_rebuilt_at)}</b></div><div class="kv"><span>Cache events</span><b>${fmt(cache.misses||0)} misses · ${fmt(cache.invalidations||0)} invalidations</b></div><div class="kv cache-reason-row"><span>Invalidation reasons</span><b class="chip-list">${reasonNodes.join('')||'<span class="detail">None recorded</span>'}</b></div><div class="kv"><span>Validation</span><b>${esc(cache.validation||'unknown')}</b></div>`}
function healthChips(values,empty){const items=Array.isArray(values)?values.filter(value=>typeof value==='string'&&value):[];return items.map(value=>`<span class="chip" title="${esc(value)}">${esc(value)}</span>`).join('')||`<span class="detail">${esc(empty)}</span>`}
function renderDashboardHealth(health={}){const scan=health.scan||{},limits=scan.limits||{},cache=scan.cache||{},manifest=scan.report_manifest||{};return `<div class="kv"><span>Report root</span><b class="mono health-root">${esc(scan.root||'—')}</b></div><div class="kv"><span>Report selection</span><b>${pill(manifest.enabled?'explicit manifest allowlist':'benchmark-prefix curation',manifest.enabled?true:null)}</b></div><div class="kv"><span>Curated manifest</span><b class="mono health-root">${manifest.enabled?esc(manifest.path)+` · ${fmt(manifest.report_count)} files`:'Disabled'}</b></div><div class="kv health-list-row"><span>Allowlisted reports</span><div class="chip-list">${healthChips(manifest.reports,'No explicit allowlist')}</div></div><div class="kv"><span>Effective scan limits</span><b>${fmt(limits.max_entries)} entries · depth ${fmt(limits.max_depth)} · ${fmt(limits.max_files)} files · ${fmt(limits.max_file_bytes)} bytes max</b></div><div class="kv health-list-row"><span>Effective exclusions</span><div class="chip-list">${healthChips(scan.benchmark_trees,'None')}</div></div><div class="kv health-list-row"><span>Configured exclusions</span><div class="chip-list">${healthChips(scan.configured_benchmark_trees,'None; automatic detection only')}</div></div><div class="kv health-list-row"><span>Automatic prefixes</span><div class="chip-list">${healthChips(scan.benchmark_tree_prefixes,'None')}</div></div><div class="kv"><span>Cache validation</span><b>${esc(cache.validation||'unknown')}</b></div>`}
function section(title,body,head=''){return `<section class="section"><div class="section-head"><h2>${esc(title)}</h2>${head}</div>${body}</section>`}
function errorBox(e){return `<div class="error">${esc(e)}</div>`}
function renderOverview(){const o=state.data.overview,g=o.graph||{},j=o.journal||{},c=o.calibration||{},b=o.benchmarks||{},w=o.weekly||{},scan=w.scan||{};const edgeTypes=Object.entries(g.counts?.edge_types||{});const outcomes=j.outcomes||{};const total=Object.values(outcomes).reduce((a,v)=>a+v,0);const cards=`<div class="grid cards">${card('Indexed skills',g.counts?.skills||0,'catalog nodes')}${card('Typed edges',g.counts?.edges||0,'relationship records')}${card('Journal routes',j.routes||0,'recent decisions')}${card('Calibration reports',c.reports||0,'JSON artifacts')}${card('Benchmark reports',b.reports||0,'JSON artifacts')}${card('Open actions',w.counts?.open_items||0,'weekly review queue')}</div>`;const edge=edgeTypes.length?edgeTypes.map(([k,v])=>`<div class="metric-row"><div class="name">${esc(k)}</div><div class="bar"><i style="width:${Math.round(v/Math.max(1,...edgeTypes.map(x=>x[1]))*100)}%"></i></div><div class="num">${v}</div></div>`).join(''):'<div class="empty">No graph loaded.</div>';const outcome=Object.entries(outcomes).map(([k,v])=>`<div class="metric-row"><div class="name">${esc(k)}</div><div class="bar"><i style="width:${total?Math.round(v/total*100):0}%"></i></div><div class="num">${v}</div></div>`).join('')||'<div class="empty">No outcomes loaded.</div>';const latest=b.latest?`<div class="cal-card"><h3>${esc(b.latest.name)}</h3><div class="kv"><span>benchmark</span><b>${esc(b.latest.benchmark)}</b></div><div class="kv"><span>cases</span><b>${fmt(b.latest.cases)}</b></div><div class="kv"><span>passed</span><b>${pill(b.latest.passed?'passed':'failed',b.latest.passed)}</b></div></div>`:'<div class="empty">No benchmark report found.</div>';return cards+`<div class="grid two" style="margin-top:16px">${section('Graph composition',edge)}${section('Outcome mix',outcome)}${section('Latest benchmark',latest)}${section('Report cache',renderCachePanel(scan.cache),pill(scan.cache?.status||'unknown',scan.cache?.freshness==='fresh'?true:scan.cache?.status==='invalidated'?false:null))}${section('Dashboard health',renderDashboardHealth(state.data.health||{}),pill(state.data.health?.ok?'API ready':'API unavailable',state.data.health?.ok))}${section('Artifact health',`<div class="kv"><span>Index</span><b>${pill(g.ok?'ready':g.error||'missing',g.ok)}</b></div><div class="kv"><span>Journal</span><b>${pill(j.ok?'ready':j.error||'missing',j.ok)}</b></div><div class="kv"><span>Weekly report</span><b>${pill(w.status==='ready'?'ready':w.status==='no_reports'?'no report':'unavailable',w.status==='ready')}</b></div><div class="kv"><span>Report scan</span><b>${fmt(scan.entries_scanned||0)} entries · ${fmt(scan.elapsed_ms||0)} ms${scan.truncated?' · capped':''} · cache ${esc(scan.cache?.status||'unknown')}</b></div><div class="kv"><span>Reports root</span><b class="mono">${esc(o.paths?.reports||'�')}</b></div><div class="kv"><span>Report discovery</span><b>${pill(scan.selection_mode==='explicit_manifest'?'manifest allowlist':scan.curated_only?'prefix curated':'broad scan',scan.curated_only)} · curated only · ${fmt(scan.skipped_benchmark_trees||0)} benchmark trees skipped</b></div>`)}</div>`}
function renderGraph(){const g=state.data.graph;if(!g.ok)return errorBox(g.error);const ns=(g.nodes||[]).slice(0,180),es=g.edges||[];const W=1000,H=520,cx=W/2,cy=H/2,r=Math.min(W,H)*.39;const pos={};ns.forEach((n,i)=>{const a=(i/Math.max(1,ns.length))*Math.PI*2-.5;pos[n.id]={x:cx+Math.cos(a)*r*(ns.length<12?1:.92),y:cy+Math.sin(a)*r*(ns.length<12?1:.92),n}});const colors=['#63d9e8','#73e0a2','#f6c76b','#bda5ff','#ff8297','#8fb7ff'];const typeColor={};Object.keys(g.counts?.edge_types||{}).forEach((t,i)=>typeColor[t]=colors[i%colors.length]);let svg=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="skill graph"><defs><filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>`;es.forEach(e=>{if(pos[e.source]&&pos[e.target])svg+=`<line x1="${pos[e.source].x}" y1="${pos[e.source].y}" x2="${pos[e.target].x}" y2="${pos[e.target].y}" stroke="${typeColor[e.type]||'#45617e'}" stroke-opacity=".38" stroke-width="${1+(e.weight||0)*2}"/>`});ns.forEach((n,i)=>{const p=pos[n.id],fill=colors[i%colors.length];svg+=`<g filter="url(#glow)"><circle cx="${p.x}" cy="${p.y}" r="${n.domain?7:5}" fill="${fill}" fill-opacity=".9"/><text x="${p.x+10}" y="${p.y+4}" fill="#dbe8fa" font-size="11">${esc(n.name)}</text></g>`});svg+='</svg>';const legend=Object.entries(g.counts?.edge_types||{}).map(([t,v])=>`<span><i style="background:${typeColor[t]}"></i>${esc(t)} (${v})</span>`).join('');const table=ns.slice(0,30).map(n=>`<tr><td class="mono">${esc(n.id)}</td><td>${esc(n.domain||'—')}</td><td>${esc(n.tags.join(', ')||'—')}</td><td>${fmt(n.confidence)}</td></tr>`).join('');return section(`Graph · ${g.counts?.skills||0} nodes / ${g.counts?.edges||0} edges`,svg,`<span class="pill">${ns.length<180?'all nodes':'first 180 nodes'}</span>`)+`<div class="legend">${legend}</div>`+section('Node sample',`<table><thead><tr><th>skill</th><th>domain</th><th>tags</th><th>confidence</th></tr></thead><tbody>${table}</tbody></table>`)}
function roleChip(item,kind){return item?`<span class="role ${kind}">${esc(item.skill_id)}${item.confidence!=null?' · '+fmt(item.confidence):''}</span>`:'<span class="role">—</span>'}
function renderRoutes(){const r=state.data.journal;if(!r.ok)return errorBox(r.error);const rows=(r.routes||[]).map(x=>`<tr><td class="mono">${esc(x.created_at)}</td><td>${roleChip(x.lead,'lead')}<br>${(x.support||[]).map(v=>roleChip(v,'support')).join('')}${roleChip(x.validator,'validator')}${roleChip(x.fallback,'fallback')}</td><td>${esc(x.calibration_policy?.version?'policy v'+x.calibration_policy.version:'no artifact policy')}</td><td class="mono">${esc(x.query_sha256?.slice(0,16)||'—')}</td></tr>`).join('');return section(`Recent routes · ${r.routes?.length||0}`,`<table><thead><tr><th>created</th><th>selected roles</th><th>policy</th><th>query hash</th></tr></thead><tbody>${rows||'<tr><td colspan="4" class="empty">No decision events.</td></tr>'}</tbody></table>`)}
function renderJournal(){const r=state.data.journal;if(!r.ok)return errorBox(r.error);const rows=(r.events||[]).map(e=>`<div class="event"><div class="seq">#${e.sequence}</div><div class="kind">${esc(e.kind)}</div><div><div class="payload mono">${esc(JSON.stringify(e.payload))}</div><div class="detail">${esc(e.created_at)} · parent ${esc(e.parent_event_id||'—')}</div></div></div>`).join('');return section(`Journal events · ${r.events?.length||0}`,rows||'<div class="empty">No events.</div>',r.events?.[0]?pill('append-only timeline',true):'')}
function renderCalibration(){const c=state.data.calibration;const reports=c.reports||[];if(!reports.length)return section('Calibration reports','<div class="empty">No calibration report JSON found.</div>');const cards=reports.map(x=>{const drift=x.temporal_drift||{};const held=x.heldout_metrics||{};return `<div class="cal-card"><h3>${esc(x.name)}</h3><div class="kv"><span>global threshold</span><b>${fmt(x.global_policy?.threshold)}</b></div><div class="kv"><span>samples</span><b>${fmt(x.global_policy?.samples)}</b></div><div class="kv"><span>Wilson lower</span><b>${fmt(x.global_policy?.selected_wilson_lower)}</b></div><div class="kv"><span>temporal</span><b>${pill(drift.status||'unavailable',drift.status==='in_sync')}</b></div><div class="kv"><span>held-out hit rate</span><b>${pct(held.positive_hit_rate)}</b></div><h3 style="margin-top:13px">Domains</h3>${Object.entries(x.domain_policies||{}).map(([name,p])=>`<div class="kv"><span>${esc(name)}</span><b>${fmt(p.threshold)} · ${fmt(p.samples)}</b></div>`).join('')||'<div class="detail">No domain policies.</div>'}</div>`}).join('');return section(`Calibration history · ${reports.length}`,`<div class="cal-grid">${cards}</div>`)}
function renderBenchmarks(){const b=state.data.benchmarks;const rows=(b.reports||[]).map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.benchmark)}</td><td>${pill(x.passed?'passed':'failed',x.passed)}</td><td>${esc((x.sizes||[]).join(', ')||'—')}</td><td>${fmt(x.total_seconds)}s</td><td>${(x.speedups||[]).map(v=>fmt(v)+'×').join(', ')||'—'}</td><td>${(x.statuses||[]).map(s=>`<span class="pill ${s==='completed'?'good':'warn'}">${esc(s)}</span>`).join(' ')}</td></tr>`).join('');return section(`Benchmark history · ${b.reports?.length||0}`,`<table><thead><tr><th>report</th><th>benchmark</th><th>result</th><th>sizes</th><th>seconds</th><th>speedup</th><th>status</th></tr></thead><tbody>${rows||'<tr><td colspan="7" class="empty">No benchmark reports.</td></tr>'}</tbody></table>`)}
function renderSkippedBenchmarkTrees(){const data=state.data.skippedTrees||{};const trees=data.trees||[];const rows=trees.map(tree=>`<tr><td><div class="mono">${esc(tree.name)}</div><div class="detail mono" title="${esc(tree.path)}">${esc(tree.path)}</div></td><td>${esc((tree.exclusion_sources||[]).join(', ')||'detected')}</td><td>${pill(tree.active?'skipped':'inactive',tree.active)}</td><td>${fmtBytes(tree.shallow_size_bytes)}<div class="detail">${fmt(tree.direct_file_bytes)} direct file bytes</div></td><td>${fmt(tree.direct_entry_count)}<div class="detail">${fmt(tree.direct_file_count)} files · ${fmt(tree.direct_directory_count)} dirs · ${fmt(tree.direct_symlink_or_junction_count)} links</div></td><td class="mono">${esc(tree.modified_at||'—')}</td><td>${tree.error?pill(tree.error,false):pill('readable',true)}</td></tr>`).join('');const summary=`<div class="grid cards"><div class="card"><div class="label">Detected trees</div><div class="value">${fmt(data.counts?.trees||0)}</div></div><div class="card"><div class="label">Active exclusions</div><div class="value">${fmt(data.counts?.active||0)}</div></div><div class="card"><div class="label">Shallow size</div><div class="value">${fmtBytes(data.shallow_bytes||0)}</div></div><div class="card"><div class="label">Traversal</div><div class="value" style="font-size:18px">None</div><div class="detail">root metadata + direct files only</div></div></div>`;return summary+`<div style="height:16px"></div>`+section(`Skipped benchmark trees · ${data.counts?.active||0} active`,`<div class="detail" style="margin-bottom:10px">Selection mode: ${esc(data.selection_mode||'unknown')} · recursive traversal is disabled</div><table><thead><tr><th>tree</th><th>source</th><th>status</th><th>shallow size</th><th>direct entries</th><th>modified</th><th>health</th></tr></thead><tbody>${rows||'<tr><td colspan="7" class="empty">No benchmark trees detected.</td></tr>'}</tbody></table>`)}
function actionPriority(priority){return priority==='high'?'bad':priority==='medium'?'warn':'good'}
function actionStatus(status){return status==='resolved'||status==='closed'?true:status==='acknowledged'?null:status==='open'?null:false}
async function setActionStatus(item,status,button){let operatorNote;let actor;if(status==='reopen'){operatorNote=window.prompt('Operator note required to reopen this action:');if(operatorNote===null)return;operatorNote=operatorNote.trim();if(!operatorNote){alert('An operator note is required to reopen an action.');return}if(operatorNote.length>2000){alert('Operator note must be 2,000 characters or fewer.');return}actor=window.prompt('Optional actor identity:');if(actor===null)actor=undefined;else{actor=actor.trim();if(actor.length>256){alert('Actor identity must be 256 characters or fewer.');return}}}const buttons=button?.parentElement?.querySelectorAll('button')||[];buttons.forEach(b=>b.disabled=true);try{const payload={report_id:item.report_id,action_id:item.id,status};if(operatorNote!==undefined)payload.operator_note=operatorNote;if(actor!==undefined&&actor!=='')payload.actor=actor;const r=await fetch('/api/action-items/status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const result=await r.json();if(!r.ok)throw new Error(result.error||'Action update failed');await load()}catch(e){alert(e.message||'Action update failed');buttons.forEach(b=>b.disabled=false)}}
function renderWeeklyLegacy(){const w=state.data.weekly;if(!w?.ok)return errorBox(w?.error||'Weekly report unavailable.');const latest=w.latest;if(!latest)return section('Action queue','<div class="empty">No weekly operations report with action items found. Generate one with weekly-report --format json.</div>',pill('no reports',false));const stateWarning=w.action_state?.error?errorBox('Action overlay unavailable: '+w.action_state.error):'';const counts=latest.counts||{},statusCounts=latest.status_counts||{};const summary=`<div class="queue-summary"><div class="queue-stat"><span class="label">Open</span><strong>${fmt(counts.open_items||0)}</strong></div><div class="queue-stat"><span class="label">Acknowledged</span><strong>${fmt(statusCounts.acknowledged||0)}</strong></div><div class="queue-stat"><span class="label">Resolved</span><strong>${fmt(statusCounts.resolved||0)}</strong></div><div class="queue-stat"><span class="label">High priority</span><strong>${fmt(counts.by_priority?.high||0)}</strong></div><div class="queue-stat"><span class="label">Medium priority</span><strong>${fmt(counts.by_priority?.medium||0)}</strong></div><div class="queue-stat"><span class="label">Low priority</span><strong>${fmt(counts.by_priority?.low||0)}</strong></div></div>`;const items=(latest.action_items||[]).map(item=>{const id=esc(item.id||'');const canReopen=item.status==='acknowledged'||item.status==='resolved';const controls=`<div class="action-buttons">${item.status!=='resolved'?`<button class="action-button" data-action-id="${id}" data-report-id="${esc(item.report_id||'')}" data-status="acknowledged">Mark acknowledged</button><button class="action-button" data-action-id="${id}" data-report-id="${esc(item.report_id||'')}" data-status="resolved">Mark resolved</button>`:''}${canReopen?`<button class="action-button" data-action-id="${id}" data-report-id="${esc(item.report_id||'')}" data-status="reopen">Reopen</button>`:''}</div>`;return `<div class="action-item ${esc(item.priority||'low')}"><div>${pill(item.priority||'low',item.priority==='high'?false:item.priority==='medium'?null:true)}</div><div>${pill(item.status||'open',actionStatus(item.status||'open'))}</div><div><div class="action-signal">${esc(item.signal||item.id||'review signal')}</div><div class="action-detail">${esc(item.recommended_action||'Review this signal.')}</div><div class="action-evidence">${esc(JSON.stringify(item.evidence||{}))}</div>${controls}<div class="action-state">${item.status_source==='operator'?'operator overlay':'source report'}${item.operator_status==='reopened'?' · Reopened':''}${item.status_updated_at?' · '+esc(item.status_updated_at):''}${item.operator_note?` · Note: ${esc(item.operator_note)}`:''}${item.actor?` · Actor: ${esc(item.actor)}`:''}</div></div></div>`}).join('');return section(`Action queue · ${counts.open_items||0} open`,stateWarning+summary+`<div class="action-list">${items||'<div class="empty">No action items in this report.</div>'}</div>`,`${pill(latest.read_only?'source read-only':'write-capable',latest.read_only)}`)}
function periodKey(period){return `${period?.start||'unknown'}::${period?.end||'unknown'}`}
function periodLabel(period){return `${period?.start||'unknown'} → ${period?.end||'unknown'}`}
function weeklyActionItems(weekly){return (weekly?.reports||[]).flatMap(report=>(report.action_items||[]).map(item=>({...item,_period:report.period||{},_period_key:periodKey(report.period||{}),_report_name:report.name||''})))}
function actionOption(value,label,selected){return `<option value="${esc(value)}"${value===selected?' selected':''}>${esc(label)}</option>`}
function actionFilterBar(items,reports){const filters=state.filters;const priorities=[...new Set(items.map(item=>item.priority||'low'))].sort();const statuses=[...new Set(items.map(item=>item.status||'open'))].sort();const periods=[...new Map(reports.map(report=>[periodKey(report.period||{}),{value:periodKey(report.period||{}),label:periodLabel(report.period||{})}])).values()].sort((a,b)=>a.label.localeCompare(b.label));const skills=[...new Set(items.flatMap(item=>item.affected_skills||[]))].sort();return `<div class="filter-bar"><div class="filter-field"><label for="priority-filter">Priority</label><select id="priority-filter" data-filter="priority">${actionOption('', 'All priorities', filters.priority)}${priorities.map(value=>actionOption(value,value,filters.priority)).join('')}</select></div><div class="filter-field"><label for="status-filter">Status</label><select id="status-filter" data-filter="status">${actionOption('', 'All statuses', filters.status)}${statuses.map(value=>actionOption(value,value,filters.status)).join('')}</select></div><div class="filter-field"><label for="period-filter">Report period</label><select id="period-filter" data-filter="period">${actionOption('', 'All periods', filters.period)}${periods.map(value=>actionOption(value.value,value.label,filters.period)).join('')}</select></div><div class="filter-field"><label for="skill-filter">Affected skill</label><select id="skill-filter" data-filter="skill">${actionOption('', 'All skills', filters.skill)}${skills.map(value=>actionOption(value,value,filters.skill)).join('')}</select></div></div>`}
function freshnessIndicator(freshness){const status=freshness?.status||'unknown';const label=status==='fresh'?'fresh':status==='stale'?'stale':'unknown';const ok=status==='fresh'?true:status==='stale'?false:null;return `<div class="freshness-indicator">${pill(label,ok)}<div><div class="detail">Report period end: ${esc(freshness?.report_period_end||'unknown')}</div><div class="detail">Report file modified: ${esc(freshness?.report_modified_at||'unknown')}</div><div class="detail">Journal head: ${esc(freshness?.journal_head_at||'unknown')}</div><div class="detail">${esc((freshness?.reasons||[]).join(', ')||'All compared timestamps are current.')}</div></div></div>`}
function renderWeekly(){const weekly=state.data.weekly;if(!weekly?.ok)return errorBox(weekly?.error||'Weekly report unavailable.');const reports=weekly.reports||[];if(!reports.length)return section('Action queue','<div class="empty">No weekly operations report with action items found. Generate one with weekly-report --format json.</div>',pill('no reports',false));const allItems=weeklyActionItems(weekly),filters=state.filters;const selectedReport=filters.period?reports.find(report=>periodKey(report.period||{})===filters.period):weekly.latest;const freshness=selectedReport?.freshness||weekly.freshness||{};const items=allItems.filter(item=>(!filters.priority||item.priority===filters.priority)&&(!filters.status||(item.status||'open')===filters.status)&&(!filters.period||item._period_key===filters.period)&&(!filters.skill||(item.affected_skills||[]).includes(filters.skill)));const stateWarning=weekly.action_state?.error?errorBox('Action overlay unavailable: '+weekly.action_state.error):'';const freshnessBanner=freshnessIndicator(freshness);const statusCounts=items.reduce((counts,item)=>{const status=item.status||'open';counts[status]=(counts[status]||0)+1;return counts},{});const priorityCounts=items.reduce((counts,item)=>{const priority=item.priority||'low';counts[priority]=(counts[priority]||0)+1;return counts},{});const summary=`<div class="queue-summary"><div class="queue-stat"><span class="label">Matching</span><strong>${fmt(items.length)}</strong></div><div class="queue-stat"><span class="label">Open</span><strong>${fmt(statusCounts.open||0)}</strong></div><div class="queue-stat"><span class="label">Acknowledged</span><strong>${fmt(statusCounts.acknowledged||0)}</strong></div><div class="queue-stat"><span class="label">Resolved</span><strong>${fmt(statusCounts.resolved||0)}</strong></div><div class="queue-stat"><span class="label">High priority</span><strong>${fmt(priorityCounts.high||0)}</strong></div></div>`;const rendered=items.map(item=>{const id=esc(item.id||'');const canReopen=item.status==='acknowledged'||item.status==='resolved';const controls=`<div class="action-buttons">${item.status!=='resolved'?`<button class="action-button" data-action-id="${id}" data-report-id="${esc(item.report_id||'')}" data-status="acknowledged">Mark acknowledged</button><button class="action-button" data-action-id="${id}" data-report-id="${esc(item.report_id||'')}" data-status="resolved">Mark resolved</button>`:''}${canReopen?`<button class="action-button" data-action-id="${id}" data-report-id="${esc(item.report_id||'')}" data-status="reopen">Reopen</button>`:''}</div>`;const skills=(item.affected_skills||[]).join(', ');return `<div class="action-item ${esc(item.priority||'low')}"><div>${pill(item.priority||'low',item.priority==='high'?false:item.priority==='medium'?null:true)}</div><div>${pill(item.status||'open',actionStatus(item.status||'open'))}</div><div><div class="action-signal">${esc(item.signal||item.id||'review signal')}</div><div class="action-detail">${esc(item.recommended_action||'Review this signal.')}</div><div class="action-detail">Period: ${esc(periodLabel(item._period))}${skills?' · Affected: '+esc(skills):''}</div><div class="action-evidence">${esc(JSON.stringify(item.evidence||{}))}</div>${controls}<div class="action-state">${item.status_source==='operator'?'operator overlay':'source report'}${item.operator_status==='reopened'?' · Reopened':''}${item.status_updated_at?' · '+esc(item.status_updated_at):''}${item.operator_note?` · Note: ${esc(item.operator_note)}`:''}${item.actor?` · Actor: ${esc(item.actor)}`:''}</div></div></div>`}).join('');return actionFilterBar(allItems,reports)+section(`Action queue · ${items.length} matching`,stateWarning+freshnessBanner+summary+`<div class="action-list">${rendered||'<div class="empty">No action items match these filters.</div>'}</div>`,pill('source read-only',true))}
function render(){const [title,desc]=titles[state.view];document.getElementById('page-title').textContent=title;document.getElementById('page-desc').textContent=desc;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===state.view));const views={overview:renderOverview,graph:renderGraph,routes:renderRoutes,journal:renderJournal,calibration:renderCalibration,benchmarks:renderBenchmarks,skippedTrees:renderSkippedBenchmarkTrees,weekly:renderWeekly};document.getElementById('content').innerHTML=views[state.view]();if(state.view==='weekly'){document.querySelectorAll('[data-filter]').forEach(select=>select.addEventListener('change',()=>{state.filters[select.dataset.filter]=select.value;syncUrl();render()}));document.querySelectorAll('.action-button').forEach(button=>button.addEventListener('click',()=>{const item={id:button.dataset.actionId,report_id:button.dataset.reportId};setActionStatus(item,button.dataset.status,button)}))}}
document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>{state.view=b.dataset.view;syncUrl();render()}));document.getElementById('refresh').addEventListener('click',async()=>{document.getElementById('content').innerHTML='<div class="empty">Refreshing…</div>';await load()});load().catch(e=>document.getElementById('content').innerHTML=errorBox(e));
</script>
</body>
</html>
